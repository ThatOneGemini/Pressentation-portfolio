<!DOCTYPE html>
<html>
    <head>
            <meta charset="utf-8">
            <title>Præsentation Portofolio</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link href="./css/style2.css" rel="stylesheet" type="text/css"/>
            <!--fonts-->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Courgette&family=Milonga&family=Pridi:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>


        <main>
            <section class="carousel" aria-label="Gallery">
                <ol class="carousel__viewport">
                    <li id="carousel__slide1"
                        tabindex="0"
                        class="carousel__slide">

                        <img src="./images/Carousel__slide1.png" alt="moving-art-project">

                        <div class="carousel__snapper">
                            <a href="#carousel__slide4"
                            class="carousel__prev"> Go to last slide</a>
                            <a href="#carousel__slide2"
                            class="carousel__next"> Go to next slide</a>
                        </div>
                    </li>

                    <li id="carousel__slide2"
                        tabindex="0"
                        class="carousel__slide">

                        <img src="./images/Carousel__slide2.gif" alt="pixel-gif">

                        <div class="carousel__snapper">
                            <a href="#carousel__slide1"
                            class="carousel__prev"> Go to previous slide</a>
                            <a href="#carousel__slide3"
                            class="carousel__next"> Go to next slide</a>
                        </div>
                    </li>

                    <li id="carousel__slide3"
                        tabindex="0"
                        class="carousel__slide">

                        <img src="./images/Carousel__slide3.png" alt="character-design-image">
                        
                        <div class="carousel__snapper">
                                <a href="#carousel__slide2"
                                class="carousel__prev"> Go to previous slide</a>
                                <a href="#carousel__slide4"
                                class="carousel__next"> Go to next slide</a>
                        </div>
                    </li>

                    <li id="carousel__slide4"
                        tabindex="0"
                        class="carousel__slide">
                        
                        <img src="./images/Carousel__slide4.jpg" alt="video-editing-image">
                        
                        <div class="carousel__snapper">
                                <a href="#carousel__slide3"
                                class="carousel__prev"> Go to previous slide</a>
                                <a href="#carousel__slide1"
                                class="carousel__next"> Go to next slide</a>
                        </div>
                    </li>
                </ol>

                <aside class="carousel__navigation">
                    <ol class="carousel__navigation-list">
                        <li class="carousel__navigation-item">
                            <a href="#carousel__slide1"
                            class="carousel__navigation-button"> Go to slide 1</a>
                        </li>

                        <li class="carousel__navigation-item">
                            <a href="#carousel__slide2"
                            class="carousel__navigation-button"> Go to slide 2</a>
                        </li>

                        <li class="carousel__navigation-item">
                            <a href="#carousel__slide3"
                            class="carousel__navigation-button"> Go to slide 3</a>
                        </li>

                        <li class="carousel__navigation-item">
                            <a href="#carousel__slide4"
                            class="carousel__navigation-button"> Go to slide 4</a>
                        </li>
                    </ol>
                </aside>
            </section>
        </main>
    </body>
</html>
